# Production nginx for the API host (Laravel via php-fpm). The SPA is static (S3 + CloudFront
# or this server, see the second server block). Replace example.com / paths for your setup.

# ---------------------------------------------------------------- API: api.example.com
server {
    listen 443 ssl http2;
    server_name api.example.com;
    root /home/forge/api.example.com/current/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 110m;          # largest upload (lesson resources: 100 MB)
    server_tokens off;

    # Compression (Laravel sends JSON; brotli if the module is installed).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    # brotli on; brotli_types application/json application/javascript text/css;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
}

# ---------------------------------------------------------------- SPA: www.example.com
# (Skip if the SPA is on S3 + CloudFront — put the same headers in a CloudFront response
#  headers policy.)
server {
    listen 443 ssl http2;
    server_name www.example.com;
    root /home/forge/www.example.com/current/frontend/dist;

    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    server_tokens off;

    gzip on;
    gzip_types application/javascript text/css image/svg+xml application/json;

    # Security headers for the SPA. The sha256 is the inline theme script in index.html
    # (recompute if that script changes: see docs/PERFORMANCE.md). The CSP allows only what the app loads:
    #  - API + Sanctum (connect), Bunny Stream (media/img), Zoom Web SDK (live classes),
    #  - Cloudflare Turnstile (captcha), GA4 + Meta Pixel (only after cookie consent),
    #  - Stripe Checkout / Razorpay (checkout redirect + modal).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ykx+WveRSvZdgR+SKY2RckLKl8eaG72gzJawUfXebqY=' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://checkout.razorpay.com https://js.stripe.com https://www.googletagmanager.com https://connect.facebook.net https://source.zoom.us; connect-src 'self' https://api.example.com https://*.b-cdn.net https://*.zoom.us wss://*.zoom.us https://www.google-analytics.com https://*.analytics.google.com https://www.facebook.com https://lumberjack.razorpay.com; img-src 'self' data: blob: https://*.b-cdn.net https://api.example.com https://www.google-analytics.com https://www.facebook.com https://lh3.googleusercontent.com; media-src 'self' blob: https://*.b-cdn.net; frame-src https://challenges.cloudflare.com https://api.razorpay.com https://checkout.razorpay.com https://js.stripe.com https://*.zoom.us; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Hashed build assets: cache forever. index.html: always revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# ---------------------------------------------------------------- redirects
server {
    listen 80;
    server_name api.example.com www.example.com example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name example.com;
    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    return 301 https://www.example.com$request_uri;
}
